[project]
name = "simple-semantic"
version = "0.1.0"
description = "Brute-force semantic search over a memory-mapped matrix"
requires-python = ">=3.11"
license = { text = "MIT" }
# core takes numpy and an HTTP client. Nothing else. See CLAUDE.md.
dependencies = ["numpy>=1.26", "httpx>=0.27"]

[project.scripts]
simple-semantic = "simple_semantic.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_semantic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
# Deliberately no python_version pin. Pinning it to the floor version made
# mypy parse *every* file as that version, including numpy's own stubs —
# and numpy >= 2.5 writes them with PEP 695 `type` statements, which are
# 3.12+ syntax. That failed on any interpreter newer than the pin while
# passing locally on the pin itself. Mypy defaults to the running
# interpreter, and CI runs it on both ends of the supported range instead.
files = ["src/simple_semantic"]

