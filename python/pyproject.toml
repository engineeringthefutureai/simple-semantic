[project]
name = "simple-semantic"
version = "0.1.0"
description = "Brute-force semantic search over a memory-mapped matrix"
requires-python = ">=3.11"
license = { text = "MIT" }
# core takes numpy and an HTTP client. Nothing else. See CLAUDE.md.
dependencies = ["numpy>=1.26", "httpx>=0.27"]

[project.scripts]
simple-semantic = "simple_semantic.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_semantic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/simple_semantic"]

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true
