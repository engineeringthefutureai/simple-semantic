[project]
name = "simple-semantic"
version = "0.1.0"
description = "Brute-force semantic search over a memory-mapped matrix"
requires-python = ">=3.11"
license = { text = "MIT" }
# core takes numpy. Nothing else — GeminiEmbedder is the only thing that needs
# an HTTP client, so it is an extra rather than a cost every install pays.
dependencies = ["numpy>=1.26"]

[project.scripts]
simple-semantic = "simple_semantic.cli:main"

[project.optional-dependencies]
gemini = ["httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_semantic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
# No python_version pin: it would make mypy parse every file as that version,
# including numpy's own stubs, which use 3.12+ syntax. CI runs mypy on both ends
# of the supported range instead.
files = ["src/simple_semantic"]

